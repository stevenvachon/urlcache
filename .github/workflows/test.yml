on:
  pull_request:
    branches: [next]
  push:
    branches: [next]

jobs:
  Test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 22
          - node: 'lts/*'
          - node: latest
            experimental: true
    continue-on-error: ${{ matrix.experimental || false }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # Node 22 ships npm 10, which was crashing on `npm i` (`edgesOut`).
      - name: Upgrade npm
        if: matrix.node == 22
        run: npm install -g npm@11
      - name: Install dependencies
        run: npm install
      - name: Run build
        run: npm run build
      - name: Run tests
        run: npm test
      - name: Upload results to Codecov
        if: github.event_name == 'push'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: stevenvachon/urlcache
